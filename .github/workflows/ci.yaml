name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
          module: github.com/Sigeth/opslab-ci@v0.2.0
          verb: call
          args: challenge-lint --source=.
